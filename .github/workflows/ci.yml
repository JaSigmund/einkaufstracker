name: CI

on:
  push:
    branches: [main]
  pull_request:

# Der Workflow liest nur (Codereview 2026-10-16): kein Job braucht Schreibrechte am Repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (analyze und test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Alle Tests, darunter seit dem Codereview 2026-10-16 auch die Querschnittstests:
      #   test/architecture_test.dart      Schichten, keine Geheimnisse im Code, Tooltips an allen IconButtons
      #   test/ui_accessibility_test.dart  Flutter-Richtlinien: beschriftete und grosse Tippflaechen, Kontrast
      #   test/ui_layout_test.dart         kein Ueberlauf auf kleinem Handy, bei 200 % Schrift und auf dem Tablet
      - run: flutter test --coverage
      # Sperrklinke: knapp unter dem Stand vom 2026-10-16, nur anheben, nie senken (siehe tools/check_coverage.py)
      - name: Testabdeckung (Untergrenze)
        run: python3 ../tools/check_coverage.py coverage/lcov.info --min 86 --min-domain 97
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Zeitreise (Codereview 2026-10-16, B1): dieselben Tests, als waere heute 200 bzw. 400 Tage spaeter. Faellt hier etwas um,
  # prueft ein Test ein festes Datum gegen die echte Uhr und wird nach dieser Zeit auch auf main rot. Abhilfe: dem Test
  # einen festen Stichtag geben (meist `now:`). App und Tests lesen die Zeit dafuer ueber appClock (lib/core/clock.dart).
  time-travel:
    name: App-Tests in der Zukunft (+${{ matrix.days }} Tage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        days: [200, 400]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --dart-define=TEST_CLOCK_OFFSET_DAYS=${{ matrix.days }}

  web:
    # Die PWA (tools/deploy_web.sh) wurde bisher nur lokal gebaut: ein Import, den es im Browser nicht gibt, fiel erst
    # beim Veroeffentlichen auf. Ohne dart_defines startet der Build mit dem Hinweis "Konfiguration fehlt", das genuegt fuer
    # die Pruefung, dass sich alles fuer das Web uebersetzen laesst.
    name: Web-Build (PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/einkaufstracker-web/"

  android:
    # Manifest, Ressourcen und Gradle-Skript wurden bisher nur lokal gebaut (Codereview 2026-10-16). Ein Debug-Build genuegt
    # fuer die Pruefung, dass sich die App fuer Android bauen laesst; signiert wird weiterhin nur lokal (README).
    name: Android-Build (Debug-APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      # Der Runner hat nur rund 14 GB frei; NDK, CMake und die nativen Bibliotheken (ML Kit, pdfium) fuer vier ABIs
      # reichten dafuer nicht ("No space left on device"). Vorinstallierte, hier ungenutzte Werkzeuge entfernen.
      - name: Platz auf dem Runner schaffen
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      # eine ABI genuegt fuer die Pruefung von Manifest, Ressourcen und Gradle-Skript
      - run: flutter build apk --debug --target-platform android-arm64

  db:
    name: Datenbank (Schema- und RLS-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pgserver "psycopg[binary]" tzdata
      # enthaelt seit 2026-10-16 auch Sicherheits-Invarianten ueber den Katalog (RLS auf jeder Tabelle, search_path bei
      # SECURITY DEFINER, security_invoker bei Views, private Buckets, nichts fuer anon sichtbar)
      - run: python supabase/tests/run_schema_tests.py
      # Die Synonymliste (CSV) ist die Quelle, die SQL-Datei wird daraus erzeugt: beide muessen zusammenpassen
      - run: |
          python tools/build_food_synonyms.py
          git diff --exit-code tools/food_synonyms_import.sql
      # Dasselbe fuer die Stueckgewichte: CSV (gebaut aus den USDA-Daten) und SQL-Datei muessen zusammenpassen
      - run: python tools/build_food_units.py --check
      # Register der Mikronaehrstoffe (JSON) -> Dart-Datei und SQL-Import muessen zusammenpassen
      - run: python tools/build_bls_nutrients.py --check
      - run: python tools/build_retention.py --check

  function:
    name: Edge Function (Typpruefung)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # In einem leeren Ordner pruefen, damit das package.json im Repo (Supabase CLI) Deno nicht stoert. Der ganze Ordner
      # supabase/functions wird kopiert, weil die Functions gemeinsamen Code aus ../_shared importieren.
      - run: |
          mkdir -p /tmp/fncheck
          cp -r supabase/functions/. /tmp/fncheck/
          # alle Edge Functions, nicht nur eine: neue Funktionen sind damit automatisch abgedeckt. Ordner ohne index.ts
          # (z.B. _shared) sind keine Function, ihre Tests laufen trotzdem mit.
          for dir in /tmp/fncheck/*/; do
            if [ -f "$dir/index.ts" ]; then
              (cd "$dir" && deno check index.ts)
            fi
            # vorhandene Deno-Tests (*_test.ts) mit ausfuehren
            if ls "$dir"*_test.ts >/dev/null 2>&1; then
              (cd "$dir" && deno test)
            fi
          done
      # Lint ueber alle Functions (u.a. kein unbegruendetes `any`, prefer-const)
      - run: cd /tmp/fncheck && deno lint

  hygiene:
    # README-Regel "Geheimnisse gehoeren nie ins Repo" automatisch pruefen, dazu die Tests der Werkzeuge in tools/
    name: Repo-Hygiene und Werkzeuge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keine Geheimnisse und keine verbotenen Dateien im Repo
        run: python tools/check_repo_hygiene.py
      - run: pip install pandas openpyxl
      - name: Tests der Werkzeuge
        run: |
          python tools/test_check_repo_hygiene.py
          python tools/test_check_coverage.py
          python tools/test_resumable_upload.py
          python tools/test_import_bls_foods.py
