name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (analyze und test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  db:
    name: Datenbank (Schema- und RLS-Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pgserver "psycopg[binary]" tzdata
      - run: python supabase/tests/run_schema_tests.py
      # Die Synonymliste (CSV) ist die Quelle, die SQL-Datei wird daraus erzeugt: beide muessen zusammenpassen
      - run: |
          python tools/build_food_synonyms.py
          git diff --exit-code tools/food_synonyms_import.sql
      # Dasselbe fuer die Stueckgewichte: CSV (gebaut aus den USDA-Daten) und SQL-Datei muessen zusammenpassen
      - run: python tools/build_food_units.py --check

  function:
    name: Edge Function (Typpruefung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # In einem leeren Ordner pruefen, damit das package.json im Repo (Supabase CLI) Deno nicht stoert
      - run: |
          # alle Edge Functions, nicht nur eine: neue Funktionen sind damit automatisch abgedeckt
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            mkdir -p "/tmp/fncheck/$fn"
            # ganzer Ordner: eine Function darf aus mehreren Dateien bestehen (z.B. sanitize.ts neben index.ts)
            cp "$dir"*.ts "/tmp/fncheck/$fn/"
            (cd "/tmp/fncheck/$fn" && deno check index.ts)
            # vorhandene Deno-Tests (*_test.ts) mit ausfuehren
            if ls "/tmp/fncheck/$fn"/*_test.ts >/dev/null 2>&1; then
              (cd "/tmp/fncheck/$fn" && deno test)
            fi
          done
